[build]
  command = "npm run build"
  publish = "dist"

# Automatic 301 Redirect from Netlify to primary Firebase Hosting site
[[redirects]]
  from = "/*"
  to = "https://gen-lang-client-0124862842.web.app/:splat"
  status = 301
  force = true

# Cache static assets for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
